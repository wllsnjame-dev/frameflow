<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frameflow | Settings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="factory-core.js"></script>
<script src="supabase-adapter.js"></script>
<script src="status-ui.js"></script>
<link rel="stylesheet" href="responsive-fix.css">
<style>
:root{--ink:#18242b;--muted:#6f7b7d;--paper:#f5f7f4;--line:#dfe5df;--white:#fff;--teal:#087f78;--lime:#cce86b;--orange:#ec8b4e;--navy:#20383d;--shadow:0 12px 30px #20383d12;--red:#a74930}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--navy);color:#e9f0e9;padding:25px 17px}.brand{font:700 23px Arial,sans-serif;margin:0 10px 38px}.brand span{color:var(--lime)}.eyebrow{font:10px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#9eb8b2;margin:0 10px 10px}.side a{display:block;color:#bed0ca;text-decoration:none;font:600 13px Arial,sans-serif;padding:11px 12px;border-radius:6px;margin-bottom:4px}.side a:hover,.side a.active{background:#315359;color:#fff}.side-footer{margin:50px 10px 0;border-top:1px solid #456166;padding-top:18px;font:12px Arial,sans-serif}.side-footer strong{display:block;color:#fff}.side-footer span{color:#9eb8b2}.main{min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);padding:0 38px;display:flex;justify-content:space-between;align-items:center;font:12px Arial,sans-serif}.avatar{width:34px;height:34px;background:var(--lime);border-radius:50%;display:inline-grid;place-items:center;font-weight:bold;margin-left:10px}.content{max-width:980px;margin:auto;padding:35px 38px 60px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.kicker{font:700 11px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:8px}.heading h1{font-size:36px;line-height:1;margin:0}.heading p{color:var(--muted);margin:9px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font:700 11px Arial,sans-serif;letter-spacing:0.7px;text-transform:uppercase}.field input,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:14px/1.45 Georgia,serif}.field textarea{min-height:90px}.field.full{grid-column:1/-1}.primary,.secondary{border-radius:5px;padding:11px 14px;font:700 12px Arial,sans-serif}.primary{background:var(--teal);color:#fff}.secondary{background:#eaf0e9;color:var(--teal)}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.@media (max-width:900px){.layout{grid-template-columns:1fr}.side{padding:16px}.content{padding:20px 14px 40px}.form-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">frame<span>flow</span></div>
    <div class="eyebrow">Workspace</div>
    <a href="app.html">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="products.html">Products</a>
    <a href="quotation.html">Quotations</a>
    <a href="orders.html">Orders</a>
    <a href="invoices.html">Invoices</a>
    <a href="production.html">Production</a>
    <a href="stock.html">Stock</a>
    <a href="reports.html">Reports</a>
    <a class="active" href="settings.html">Settings</a>
    <div class="side-footer"><strong>Northside Windows Ltd</strong><span>Owner workspace · UK</span></div>
  </aside>
  <main class="main">
    <header class="top"><span>Settings / Company profile</span><span>Alex Morgan <i class="avatar">AM</i></span></header>
    <section class="content">
      <div class="heading">
        <div>
          <div class="kicker">Configuration</div>
          <h1>Settings</h1>
          <p>Store company details used in quotes and invoices.</p>
        </div>
      </div>
      <div class="card">
        <form id="settingsForm">
          <div class="form-grid">
            <label class="field"><span>Company name</span><input name="companyName"></label>
            <label class="field"><span>Address</span><input name="address"></label>
            <label class="field"><span>Phone</span><input name="phone"></label>
            <label class="field"><span>Email</span><input name="email" type="email"></label>
            <label class="field"><span>VAT number</span><input name="vatNumber"></label>
            <label class="field"><span>Company registration number</span><input name="companyRegistration"></label>
            <label class="field"><span>Website</span><input name="website"></label>
            <label class="field full"><span>Quotation footer</span><textarea name="quotationFooter"></textarea></label>
            <label class="field full"><span>Invoice footer</span><textarea name="invoiceFooter"></textarea></label>
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="resetSettings">Reset</button>
            <button type="submit" class="primary">Save settings</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  const db = window.frameflow ? window.frameflow.readDb() : JSON.parse(localStorage.getItem('frameflow') || '{}');
  const save = () => { if (window.frameflow) { window.frameflow.saveDb(db); } else { localStorage.setItem('frameflow', JSON.stringify(db)); } };
  const form = document.getElementById('settingsForm');
  const defaults = {
    companyName: 'Northside Windows Ltd',
    address: 'Leeds, UK',
    phone: '',
    email: '',
    vatNumber: '',
    companyRegistration: '',
    website: '',
    quotationFooter: 'Thank you for your enquiry. Terms are subject to final measurements and deposit terms.',
    invoiceFooter: 'Thank you for your business. Please pay promptly. VAT registration number to be supplied when available.'
  };

  function load() {
    const settings = { ...defaults, ...(db.settings || {}) };
    Object.entries(settings).forEach(([key, value]) => {
      if (form.elements[key]) form.elements[key].value = value || '';
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const payload = Object.fromEntries(new FormData(form).entries());
    db.settings = { ...defaults, ...(db.settings || {}), ...payload };
    db.factoryName = payload.companyName || db.factoryName || 'Northside Windows Ltd';
    save();
    alert('Settings saved.');
  });

  document.getElementById('resetSettings').addEventListener('click', function () {
    db.settings = { ...defaults };
    db.factoryName = defaults.companyName;
    save();
    load();
  });

  load();
})();
</script>
</body>
</html>
