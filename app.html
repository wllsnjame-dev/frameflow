<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frameflow | Factory operations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script src="supabase-adapter.js?v=2"></script>
<script src="factory-core.js?v=2"></script>
<script src="status-ui.js?v=2"></script>
<script defer src="dashboard-runtime.js"></script><link rel="stylesheet" href="responsive-fix.css"><style>
:root{--ink:#18242b;--muted:#6f7b7d;--paper:#f5f7f4;--line:#dfe5df;--white:#fff;--teal:#087f78;--lime:#cce86b;--orange:#ec8b4e;--navy:#20383d;--shadow:0 12px 30px #20383d12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#e9f0e9;padding:26px 18px;display:flex;flex-direction:column}.brand{font:700 23px Arial,sans-serif;letter-spacing:-1px;margin:0 10px 38px}.brand span{color:var(--lime)}.eyebrow{font:10px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#9eb8b2;margin:0 10px 10px}.nav{display:grid;gap:5px}.nav button{background:none;color:#bed0ca;text-align:left;padding:11px 12px;border-radius:6px;font:600 13px Arial,sans-serif}.nav button:hover,.nav button.active{background:#315359;color:#fff}.tenant{margin-top:auto;border-top:1px solid #456166;padding:18px 10px 0;font-family:Arial,sans-serif}.tenant strong{display:block;color:#fff;font-size:13px}.tenant small{color:#9eb8b2}.topbar{height:76px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{font:700 14px Arial,sans-serif}.user{display:flex;align-items:center;gap:12px;font:12px Arial,sans-serif}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lime);font-weight:bold}.content{max-width:1240px;padding:40px 38px;margin:auto}.view-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.kicker{color:var(--teal);font:700 11px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}.view-head h1{font-size:38px;line-height:1;margin:0;letter-spacing:-1px}.view-head p{color:var(--muted);margin:9px 0 0}.primary{background:var(--teal);color:#fff;border-radius:5px;padding:12px 16px;font:700 12px Arial,sans-serif}.ghost{background:#edf2ed;color:var(--teal);border-radius:5px;padding:10px 13px;font:700 12px Arial,sans-serif}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:7px}.metric{padding:20px}.metric label{display:block;color:var(--muted);font:11px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}.metric b{font-size:30px;display:block;margin:10px 0 3px}.metric small{color:var(--teal);font:12px Arial,sans-serif}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:18px}.panel{padding:22px}.panel h2{font-size:20px;margin:0 0 18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel-head h2{margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-family:Arial,sans-serif;font-size:12px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.status{display:inline-block;padding:5px 8px;border-radius:20px;background:#edf2ed;color:var(--teal);font-size:10px;font-weight:bold}.status.orange{background:#fff0e8;color:#b95b27}.status.lime{background:#f1f7d9;color:#607b08}.empty{color:var(--muted);padding:20px 0;text-align:center;font-family:Arial,sans-serif}.search{border:1px solid var(--line);padding:10px 12px;border-radius:4px;width:220px;margin-bottom:12px}.modal{position:fixed;inset:0;background:#18242b66;display:grid;place-items:center;padding:20px}.hidden{display:none}.modal-box{background:#fff;border-radius:7px;padding:26px;max-width:560px;width:100%}.modal-box h2{margin:0 0 20px;font-size:25px}.form{display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px;font:11px Arial,sans-serif;font-weight:bold;color:var(--muted)}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:4px;padding:10px;background:#fbfcfa;color:var(--ink)}.field textarea{min-height:76px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.notice{background:#eaf3df;border-left:3px solid var(--lime);padding:12px 14px;color:#3e5d38;font:12px Arial,sans-serif}.bar{height:9px;background:#e9eee8;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.report{padding:18px;background:#f8faf7;border:1px solid var(--line);border-radius:5px}.report b{font-size:25px;display:block;margin:8px 0}.report span{color:var(--muted);font:11px Arial,sans-serif}.toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:5px;font:12px Arial,sans-serif;display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2;padding:14px 18px}.brand{margin:0 0 15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.tenant{display:none}.topbar{padding:0 20px}.content{padding:28px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.view-head{display:block}.view-head .primary{margin-top:18px}.metrics,.form-grid,.report-grid{grid-template-columns:1fr}.search{width:100%}.topbar{height:60px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">frame<span>flow</span></div><div class="eyebrow">Workspace</div><nav class="nav" id="nav"></nav><div class="tenant"><strong>Northside Windows Ltd</strong><small>Owner workspace · UK</small></div></aside><main><header class="topbar"><div class="crumb" id="crumb">Dashboard</div><div class="user">Alex Morgan <span class="avatar">AM</span></div></header><section class="content" id="content"></section></main></div><div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div><script>
const seed={customers:[{name:'Maya Thompson',company:'Thompson Build Co',phone:'07700 900123',email:'maya@thompsonbuild.co.uk',postcode:'LS12 4AB'}],products:[{type:'UPVC Window',width:1200,height:1000,quantity:4,colour:'Anthracite Grey',glass:'A-rated clear',opening:'Tilt & turn'}],quotes:[{number:'QT-2026-0041',customer:'Maya Thompson',total:2840,status:'Sent',date:'28 Aug 2026'}],orders:[{number:'ORD-2026-0018',customer:'Maya Thompson',product:'4 × UPVC Window',amount:2840,status:'In Production'}]};let db=JSON.parse(localStorage.getItem('frameflow')||'null')||seed;const save=()=>localStorage.setItem('frameflow',JSON.stringify(db));const routes={Dashboard:'app.html',Customers:'customers.html',Products:'products.html',Quotations:'quotation.html',Orders:'orders.html',Invoices:'invoices.html',Production:'production.html',Stock:'stock.html',Reports:'reports.html',Settings:'settings.html'};const pages=['Dashboard','Customers','Products','Quotations','Orders','Invoices','Production','Stock','Reports'];pages.forEach(p=>{let b=document.createElement('button');b.textContent=p;b.dataset.page=p;b.onclick=()=>{const target=routes[p]||'app.html';if(p==='Dashboard'||target==='app.html'){render(p)}else{location.href=target}};nav.appendChild(b)});const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);const notify=s=>{toastEl.textContent=s;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',2200)};const toastEl=document.querySelector('#toast');const table=(heads,rows)=>'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';const head=(k,t,d,a='')=>'<div class="view-head"><div><div class="kicker">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+(a?'<button class="primary" id="action">＋ '+a+'</button>':'')+'</div>';
function render(page='Dashboard'){crumb.textContent=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const f={Dashboard:dashboard,Customers:customers,Products:products,Quotations:quotes,Orders:orders,Production:production,Stock:stock,Reports:reports};content.innerHTML=f[page]();bind(page)}function dashboard(){return head('Monday · 01 September 2026','Good morning, Alex','Northside Windows Ltd · Leeds, UK')+'<div class="metrics"><div class="metric"><label>Customers</label><b>'+db.customers.length+'</b><small>Active accounts</small></div><div class="metric"><label>Quotations</label><b>'+db.quotes.length+'</b><small>1 awaiting reply</small></div><div class="metric"><label>Orders</label><b>'+db.orders.length+'</b><small>2 in production</small></div><div class="metric"><label>Outstanding</label><b>£5,620</b><small>Due this month</small></div></div><div class="grid"><div class="panel"><div class="panel-head"><h2>Recent orders</h2><button class="ghost" data-go="Orders">View all</button></div>'+table(['Order','Customer','Value','Status'],db.orders.map(o=>'<tr><td>'+o.number+'</td><td>'+o.customer+'</td><td>'+money(o.amount)+'</td><td><span class="status orange">'+o.status+'</span></td></tr>').join(''))+'</div><div class="panel"><h2>Production pulse</h2><p class="notice">3 jobs need a quality check before tomorrow’s dispatch.</p><p style="font:12px Arial;margin-top:22px">Weekly target · 68%</p><div class="bar"><i style="width:68%"></i></div><p style="font:12px Arial;margin-top:22px">On-time delivery · 92%</p><div class="bar"><i style="width:92%;background:var(--lime)"></i></div></div></div>'}function customers(){return head('CRM','Customers','Manage contacts, sites and order history.','Add customer')+'<div class="panel"><input class="search" id="customerSearch" placeholder="Search customers…">'+table(['Customer','Company','Contact','Location','Orders'],db.customers.map((x,i)=>'<tr><td>'+x.name+'</td><td>'+x.company+'</td><td>'+x.phone+'<br>'+x.email+'</td><td>'+x.postcode+'</td><td>'+i+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No customers yet</td></tr>')+'</div>'}function products(){return head('Catalogue','Products','Your standard window and door configurations.','Add product')+'<div class="panel">'+table(['Product','Size','Qty','Colour','Glass','Opening'],db.products.map(x=>'<tr><td>'+x.type+'</td><td>'+x.width+' × '+x.height+' mm</td><td>'+x.quantity+'</td><td>'+x.colour+'</td><td>'+x.glass+'</td><td>'+x.opening+'</td></tr>').join(''))+'</div>'}function quotes(){return head('Sales','Quotations','Price work accurately and keep every revision in one place.','New quotation')+'<div class="panel">'+table(['Quote','Customer','Date','Total','Status'],db.quotes.map(q=>'<tr><td>'+q.number+'</td><td>'+q.customer+'</td><td>'+q.date+'</td><td>'+money(q.total)+'</td><td><span class="status lime">'+q.status+'</span></td></tr>').join(''))+'</div>'}function orders(){return head('Fulfilment','Orders','Track accepted work from confirmation to completion.','New order')+'<div class="panel">'+table(['Order','Customer','Product','Amount','Status'],db.orders.map(o=>'<tr><td>'+o.number+'</td><td>'+o.customer+'</td><td>'+o.product+'</td><td>'+money(o.amount)+'</td><td><span class="status orange">'+o.status+'</span></td></tr>').join(''))+'</div>'}function production(){return head('Workshop','Production','Live jobs for cutting, assembly and quality control.')+'<div class="panel">'+table(['Job','Order','Customer','Specification','Status'],db.orders.map((o,i)=>'<tr><td>JOB-'+String(i+1).padStart(3,'0')+'</td><td>'+o.number+'</td><td>'+o.customer+'</td><td>'+o.product+'</td><td><span class="status orange">'+o.status+'</span></td></tr>').join(''))+'</div>'}function stock(){return head('Inventory','Stock','Keep materials visible before they become bottlenecks.')+'<div class="report-grid"><div class="report"><span>UPVC profiles</span><b>142 <small>lengths</small></b><div class="bar"><i style="width:72%"></i></div></div><div class="report"><span>Glass units</span><b>38 <small>ready</small></b><div class="bar"><i style="width:38%;background:var(--orange)"></i></div></div><div class="report"><span>Hardware kits</span><b>216 <small>kits</small></b><div class="bar"><i style="width:84%;background:var(--lime)"></i></div></div></div>'}function reports(){return head('Insights','Reports','A clear view of revenue, delivery and workshop health.')+'<div class="report-grid"><div class="report"><span>Revenue · August</span><b>£42,680</b><small style="color:var(--teal)">↑ 12.4% vs July</small></div><div class="report"><span>Average order value</span><b>£2,370</b><small style="color:var(--teal)">↑ 4.8% vs July</small></div><div class="report"><span>Outstanding invoices</span><b>£5,620</b><small style="color:var(--orange)">8 invoices open</small></div></div><div class="panel" style="margin-top:18px"><h2>Monthly revenue</h2><div style="display:flex;gap:10px;align-items:end;height:150px">'+[42,58,48,70,62,86,74,100].map((n,i)=>'<div style="flex:1;height:'+n+'%;background:'+(i===7?'var(--teal)':'#d9e6d9')+';border-radius:3px 3px 0 0"></div>').join('')+'</div></div>'}
function bind(page){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));const a=document.querySelector('#action');if(a)a.onclick=()=>page==='Customers'?customerModal():page==='Products'?productModal():page==='Quotations'?quoteModal():orderModal();const s=document.querySelector('#customerSearch');if(s)s.oninput=()=>document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(s.value.toLowerCase())?'':'none')}function modal(title,form){modalBox.innerHTML='<h2>'+title+'</h2>'+form;modalEl.classList.remove('hidden')}const modalEl=document.querySelector('#modal'),modalBox=document.querySelector('#modalBox');modalEl.onclick=e=>{if(e.target===modalEl)modalEl.classList.add('hidden')};function customerModal(){modal('Add customer','<form class="form" id="customerForm"><div class="form-grid"><label class="field">Customer name<input name="name" required></label><label class="field">Company<input name="company"></label><label class="field">Phone<input name="phone" required></label><label class="field">Email<input name="email" type="email"></label><label class="field">Postcode<input name="postcode"></label><label class="field full">Notes<textarea name="notes"></textarea></label></div><div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save customer</button></div></form>');customerForm.onsubmit=e=>{e.preventDefault();db.customers.push(Object.fromEntries(new FormData(e.target)));save();modalEl.classList.add('hidden');render('Customers');notify('Customer added')}}function productModal(){modal('Add product','<form class="form" id="productForm"><div class="form-grid"><label class="field">Product type<select name="type"><option>UPVC Window</option><option>UPVC Door</option><option>Composite Door</option><option>French Door</option><option>Patio Door</option><option>Bi-fold Door</option></select></label><label class="field">Colour<input name="colour" value="White"></label><label class="field">Width (mm)<input name="width" type="number" value="1200"></label><label class="field">Height (mm)<input name="height" type="number" value="1000"></label><label class="field">Quantity<input name="quantity" type="number" value="1"></label><label class="field">Glass type<input name="glass" value="A-rated clear"></label><label class="field">Opening type<input name="opening" value="Fixed"></label></div><div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save product</button></div></form>');productForm.onsubmit=e=>{e.preventDefault();db.products.push(Object.fromEntries(new FormData(e.target)));save();modalEl.classList.add('hidden');render('Products');notify('Product added')}}function quoteModal(){modal('New quotation','<form class="form" id="quoteForm"><div class="form-grid"><label class="field">Customer<select name="customer">'+db.customers.map(x=>'<option>'+x.name+'</option>').join('')+'</select></label><label class="field">Product<select name="product">'+db.products.map(x=>'<option>'+x.type+' · '+x.width+'×'+x.height+'</option>').join('')+'</select></label><label class="field">Quantity<input name="quantity" type="number" value="1"></label><label class="field">Unit price (£)<input name="price" type="number" value="710"></label><label class="field">Discount (£)<input name="discount" type="number" value="0"></label><label class="field">VAT<select name="vat"><option value=".2">20%</option><option value="0">0%</option></select></label></div><div class="notice" id="quoteTotal">Total: £852 inc VAT</div><div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Create quotation</button></div></form>');const f=quoteForm;const calc=()=>{let d=Object.fromEntries(new FormData(f)),total=(d.quantity*d.price-d.discount)*(1+Number(d.vat));quoteTotal.textContent='Total: '+money(total)+' inc VAT'};f.oninput=calc;f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),total=(d.quantity*d.price-d.discount)*(1+Number(d.vat));db.quotes.push({number:'QT-2026-'+String(42+db.quotes.length).padStart(4,'0'),customer:d.customer,total,status:'Draft',date:'01 Sep 2026'});save();modalEl.classList.add('hidden');render('Quotations');notify('Quotation created')}}function orderModal(){modal('New order','<form class="form" id="orderForm"><div class="form-grid"><label class="field">Customer<input name="customer" value="Maya Thompson" required></label><label class="field">Product<input name="product" value="4 × UPVC Window" required></label><label class="field">Amount (£)<input name="amount" type="number" value="2840" required></label><label class="field">Status<select name="status"><option>New</option><option>Confirmed</option><option>In Production</option></select></label></div><div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Create order</button></div></form>');orderForm.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.orders.push({number:'ORD-2026-'+String(19+db.orders.length).padStart(4,'0'),...d,amount:Number(d.amount)});save();modalEl.classList.add('hidden');render('Orders');notify('Order created')}}document.addEventListener('click',e=>{if(e.target.matches('[data-close]'))modalEl.classList.add('hidden')});render();
</script></body></html>
